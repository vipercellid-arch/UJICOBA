<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Monitor Pembayaran Vipercell</title>
    <style>
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: #121212;
            display: flex; justify-content: center; align-items: center;
            height: 100vh; margin: 0; overflow: hidden;
        }
        .notification-card {
            visibility: hidden; background: #ffffff; padding: 40px;
            border-radius: 20px; box-shadow: 0 15px 35px rgba(0,0,0,0.3);
            text-align: center; transform: scale(0.5); opacity: 0;
            transition: all 0.4s cubic-bezier(0.175, 0.885, 0.32, 1.275);
        }
        .notification-card.muncul {
            visibility: visible; transform: scale(1); opacity: 1;
        }
        .ikon-sukses {
            width: 80px; height: 80px; background: #00c853; border-radius: 50%;
            display: flex; justify-content: center; align-items: center;
            margin: 0 auto 20px; color: white; font-size: 45px; font-weight: bold; opacity: 0;
        }
        .notification-card.muncul .ikon-sukses {
            animation: efekMemantul 0.6s ease-out 0.2s forwards;
        }
        @keyframes efekMemantul {
            0% { transform: scale(0); opacity: 0; }
            60% { transform: scale(1.2); opacity: 1; }
            100% { transform: scale(1); opacity: 1; }
        }
        h2 { color: #333; margin: 0 0 10px; font-size: 24px; }
        .nominal-bayar { font-size: 36px; font-weight: 900; color: #00c853; margin: 15px 0; }
        .deskripsi { color: #666; font-size: 16px; margin-bottom: 20px;}
        .brand { color: #aaa; font-size: 12px; letter-spacing: 1px; text-transform: uppercase; }
    </style>
</head>
<body>

    <div id="kartuNotif" class="notification-card">
        <div class="ikon-sukses">✓</div>
        <h2>Pembayaran Berhasil!</h2>
        <div id="teksNominal" class="nominal-bayar">Rp 0</div>
        <p class="deskripsi">Sistem otomatis telah menerima pembayaran QRIS.</p>
        <div class="brand">Vipercell ⚡</div>
    </div>

    <!-- Gunakan type="module" untuk memuat Firebase -->
    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js";
        import { getDatabase, ref, onValue } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-database.js";

        const firebaseConfig = {
            apiKey: "AIzaSyBQGZjl7uj5CRiLWCvPQKjiK4HvIYnXSJg",
            authDomain: "vipercell-fc50e.firebaseapp.com",
            databaseURL: "https://vipercell-fc50e-default-rtdb.asia-southeast1.firebasedatabase.app",
            projectId: "vipercell-fc50e",
            storageBucket: "vipercell-fc50e.firebasestorage.app",
            messagingSenderId: "710483059781",
            appId: "1:710483059781:web:b4c27b14ab34c45c892f2c",
            measurementId: "G-V7P0DJ27BL"
        };

        const app = initializeApp(firebaseConfig);
        const database = getDatabase(app);

        function tampilkanEfekSukses(nominal) {
            const kartu = document.getElementById('kartuNotif');
            const teksNominal = document.getElementById('teksNominal');
            teksNominal.innerText = nominal;
            kartu.classList.add('muncul');
            
            setTimeout(() => {
                kartu.classList.remove('muncul');
            }, 6000); // Hilang setelah 6 detik
        }

        // Mendengarkan perubahan data Realtime Database di node 'pembayaran_terakhir'
        const dbRef = ref(database, 'pembayaran_terakhir');
        let initialLoad = true; 

        onValue(dbRef, (snapshot) => {
            const data = snapshot.val();
            
            // Cek agar tidak memicu animasi saat halaman baru dimuat
            if (data && !initialLoad) {
                // Menampilkan isi notifikasi (nominal) dari MacroDroid
                tampilkanEfekSukses(data.pesan);
            }
            initialLoad = false;
        });
    </script>
</body>
</html>
