<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Monitor Pembayaran Vipercell</title>
    <style>
        /* Gaya dasar halaman */
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: #121212; /* Tema gelap agar terlihat modern */
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            margin: 0;
            overflow: hidden;
        }

        /* Kontainer Notifikasi (Awalnya tersembunyi) */
        .notification-card {
            visibility: hidden;
            background: #ffffff;
            padding: 40px;
            border-radius: 20px;
            box-shadow: 0 15px 35px rgba(0,0,0,0.3);
            text-align: center;
            transform: scale(0.5);
            opacity: 0;
            transition: all 0.4s cubic-bezier(0.175, 0.885, 0.32, 1.275);
        }

        /* Kelas saat notifikasi aktif/muncul */
        .notification-card.muncul {
            visibility: visible;
            transform: scale(1);
            opacity: 1;
        }

        /* Animasi Ikon Centang */
        .ikon-sukses {
            width: 80px;
            height: 80px;
            background: #00c853; /* Hijau Sukses */
            border-radius: 50%;
            display: flex;
            justify-content: center;
            align-items: center;
            margin: 0 auto 20px;
            color: white;
            font-size: 45px;
            font-weight: bold;
            opacity: 0;
        }

        .notification-card.muncul .ikon-sukses {
            animation: efekMemantul 0.6s ease-out 0.2s forwards;
        }

        @keyframes efekMemantul {
            0% { transform: scale(0); opacity: 0; }
            60% { transform: scale(1.2); opacity: 1; }
            100% { transform: scale(1); opacity: 1; }
        }

        /* Teks dan Tipografi */
        h2 { color: #333; margin: 0 0 10px; font-size: 24px; }
        .nominal-bayar { font-size: 36px; font-weight: 900; color: #00c853; margin: 15px 0; }
        .deskripsi { color: #666; font-size: 16px; margin-bottom: 20px;}
        .brand { color: #aaa; font-size: 12px; letter-spacing: 1px; text-transform: uppercase; }
    </style>
</head>
<body>

    <!-- Kartu Notifikasi -->
    <div id="kartuNotif" class="notification-card">
        <div class="ikon-sukses">✓</div>
        <h2>Pembayaran Berhasil!</h2>
        <div id="teksNominal" class="nominal-bayar">Rp 0</div>
        <p class="deskripsi">Sistem otomatis telah menerima pembayaran QRIS.</p>
        <div class="brand">Vipercell ⚡</div>
    </div>

    <script>
        /**
         * Fungsi untuk memicu efek animasi dan menampilkan nominal
         * @param {string} nominal - Contoh: "Rp 10.000"
         */
        function tampilkanEfekSukses(nominal) {
            const kartu = document.getElementById('kartuNotif');
            const teksNominal = document.getElementById('teksNominal');

            // 1. Masukkan teks nominal yang ditangkap dari MacroDroid
            teksNominal.innerText = nominal;

            // 2. Tambahkan kelas 'muncul' untuk memicu animasi CSS
            kartu.classList.add('muncul');

            // 3. Sembunyikan otomatis setelah 6 detik agar siap untuk transaksi berikutnya
            setTimeout(() => {
                kartu.classList.remove('muncul');
            }, 6000);
        }

        // ==========================================
        // SIMULASI TES (Bisa kamu hapus nanti)
        // ==========================================
        // Skrip ini akan otomatis memunculkan efek 2 detik setelah halaman dibuka
        setTimeout(() => {
            tampilkanEfekSukses("Rp 20.000"); 
        }, 2000);
    </script>

</body>
</html>
